events {
    worker_connections 1024;
}

http {
    # Redirection HTTP → HTTPS
    server {
        listen 80;
        server_name 57.129.112.6;
        return 301 https://$server_name$request_uri;
    }

    # ──────────────────────────────────────────────
    # FRONTEND ADMIN (React/Vite)
    # ──────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name 57.129.112.6;

        ssl_certificate /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;

        location / {
            proxy_pass http://frontend-admin:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ──────────────────────────────────────────────
    # BACKEND API (NestJS)
    # ──────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name api.57.129.112.6;

        ssl_certificate /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;

        location / {
            proxy_pass http://backend:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ──────────────────────────────────────────────
    # GRAFANA
    # ──────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name grafana.57.129.112.6;

        ssl_certificate /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;

        location / {
            proxy_pass http://grafana:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ──────────────────────────────────────────────
    # PROMETHEUS
    # ──────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name prometheus.57.129.112.6;

        ssl_certificate /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;

        location / {
            proxy_pass http://prometheus:9090;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ──────────────────────────────────────────────
    # OCR SERVICE
    # ──────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name ocr.57.129.112.6;

        ssl_certificate /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;

        location / {
            proxy_pass http://ocr-service:8001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}